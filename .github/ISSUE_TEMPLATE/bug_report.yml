name: Something is broken
description: Something in Klangbild doesn't work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Klangbild only shows what's playing and can't browse your library or pick music. For ideas and questions, please use [Discussions](https://github.com/hazymorning/Klangbild/discussions).
  - type: checkboxes
    id: broken
    attributes:
      label: Before you report
      options:
        - label: This is a bug, and I've read the [README](https://github.com/hazymorning/Klangbild#readme).
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you see, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: klangbild-version
    attributes:
      label: Klangbild version
      description: It's shown on Klangbild's page in the TV's app settings.
    validations:
      required: true
  - type: input
    id: tv-device
    attributes:
      label: Device and Android TV version
      description: The model, and the Android TV version shown under About in its settings.
    validations:
      required: true
  - type: input
    id: home-assistant
    attributes:
      label: Home Assistant version, and Music Assistant if you use it
