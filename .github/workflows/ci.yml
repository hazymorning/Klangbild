name: CI

on:
  push:
    branches: [main]
    # A tag like v2026.11.0 publishes a release. A manual run makes a release a draft instead, that
    # only the owner sees until it is published by hand on GitHub.
    tags: ["v*"]
    # A change to the texts and pictures around the app alone builds and tests nothing, since the
    # app stays the same. GitHub never applies path filters to tags, so a release always runs
    # everything, and so does a manual run.
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "LICENSE"
      - "docs/**"
      - "tools/**"
      - ".claude/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "LICENSE"
      - "docs/**"
      - "tools/**"
      - ".claude/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      release:
        description: "Run on main: make this commit a draft release under this version tag (like v2026.11.0), published by hand on GitHub; a beta (v2026.11.0-beta.1) may run on any branch; empty only builds"
        required: false
        default: ""
      measure:
        description: "Measure the landscape on the emulator (1080p and 4K): frames, CPU, memory"
        required: false
        type: choice
        options: ["off", "short", "15min"]
        default: "off"

# A new push to a pull request replaces its running checks; tags and main always finish.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Test names and the test report need a UTF-8 locale.
  LC_ALL: C.UTF-8

jobs:
  # The APK, the tests and lint run side by side; the emulator jobs need only the APK.
  apk:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check the version and its release notes
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$TAG is not a version tag like v2026.11.0."
            exit 1
          fi
          if [ ! -s "docs/releases/$TAG.md" ]; then
            echo "::error::docs/releases/$TAG.md is missing."
            exit 1
          fi

      - name: Release APK (R8)
        env:
          # A release carries its tag as version name (v2026.11.0 becomes 2026.11.0).
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release || '' }}
        run: |
          if [ -n "$TAG" ]; then
            ./gradlew :androidApp:assembleRelease "-Pklangbild.versionName=${TAG#v}" --stacktrace
          else
            ./gradlew :androidApp:assembleRelease --stacktrace
          fi

      - name: Read the version
        id: version
        run: |
          meta=androidApp/build/outputs/apk/release/output-metadata.json
          echo "version_name=$(jq -r '.elements[0].versionName' "$meta")" >> "$GITHUB_OUTPUT"
          cp "androidApp/build/outputs/apk/release/$(jq -r '.elements[0].outputFile' "$meta")" klangbild.apk

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: klangbild-apk
          path: klangbild.apk
          if-no-files-found: error

  # Every test, the picture tests too: their pictures are uploaded, and on a pull request they are
  # compared with the pictures of the branch it goes into.
  tests:
    name: Tests and pictures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Cache Robolectric android-all
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      # The speaker's end-to-end test talks to aiosendspin, the server Music Assistant 2.10.7 runs.
      - name: Sendspin's reference server
        run: |
          python3 -m venv "$RUNNER_TEMP/sendspin"
          "$RUNNER_TEMP/sendspin/bin/pip" install --quiet 'aiosendspin[server]==10.2.0'

      - name: Tests and pictures
        run: ./gradlew testDebugUnitTest -Pklangbild.pictures -Proborazzi.test.record=true "-Pklangbild.sendspin=$RUNNER_TEMP/sendspin/bin/python" --continue --stacktrace

      # How many tests ran on each platform. On a pull request, the pictures before the change
      # come with the same count for the branch it goes into.
      - name: Count the tests
        if: always()
        shell: python3 {0}
        run: |
          import collections, glob, os, xml.etree.ElementTree as ET
          ran, skipped = collections.Counter(), collections.Counter()
          for path in glob.glob("**/build/test-results/*/*.xml", recursive=True):
              for case in ET.parse(path).iter("testcase"):
                  (skipped if case.find("skipped") is not None else ran)[path.split("/")[-2]] += 1
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("| Test task | Ran | Skipped |\n| --- | --: | --: |\n")
              for task in sorted(ran | skipped):
                  summary.write(f"| {task} | {ran[task]} | {skipped[task]} |\n")

      # Each module renders its pictures into a folder of its own; together they are one tree.
      - name: Gather the pictures
        if: always()
        run: |
          mkdir -p screenshots
          for dir in */build/screenshots layers/*/build/screenshots; do
            if [ -d "$dir" ]; then cp -R "$dir/." screenshots/; fi
          done

      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: |
            androidApp/build/reports/tests
            layers/*/build/reports/tests
          if-no-files-found: warn

  # The same pictures as the branch the pull request goes into has them, rendered alongside.
  pictures-before:
    name: Pictures before the change
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Cache Robolectric android-all
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Render the pictures
        run: ./gradlew testDebugUnitTest -Pklangbild.pictures -Proborazzi.test.record=true --continue --stacktrace

      # How many tests the branch the pull request goes into ran, counted as the tests job counts.
      - name: Count the tests
        shell: python3 {0}
        run: |
          import collections, glob, os, xml.etree.ElementTree as ET
          ran, skipped = collections.Counter(), collections.Counter()
          for path in glob.glob("**/build/test-results/*/*.xml", recursive=True):
              for case in ET.parse(path).iter("testcase"):
                  (skipped if case.find("skipped") is not None else ran)[path.split("/")[-2]] += 1
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("| Test task | Ran | Skipped |\n| --- | --: | --: |\n")
              for task in sorted(ran | skipped):
                  summary.write(f"| {task} | {ran[task]} | {skipped[task]} |\n")

      # Each module renders its pictures into a folder of its own; together they are one tree.
      - name: Gather the pictures
        run: |
          mkdir -p screenshots
          for dir in */build/screenshots layers/*/build/screenshots; do
            if [ -d "$dir" ]; then cp -R "$dir/." screenshots/; fi
          done

      - name: Upload the pictures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-before
          path: screenshots
          if-no-files-found: error

  # Every picture before and after, pixel by pixel. The summary lists what looks different; the
  # artifact picture-changes shows each such picture before, after, and its changed pixels in red.
  picture-changes:
    name: Picture comparison
    needs: [tests, pictures-before]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: screenshots-before
          path: before

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: screenshots
          path: after

      - name: Compare
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          set +e
          "$RUNNER_TEMP/venv/bin/python" ci/compare-pictures.py before after changes > summary.md
          status=$?
          set -e
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = 1 ]; then
            echo "::warning title=Pictures::$(head -1 summary.md)"
          fi
          [ "$status" -le 1 ]

      - name: Upload what looks different
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: picture-changes
          path: changes
          if-no-files-found: ignore

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The app's lint looks at every module it is made of.
      - name: Android Lint
        run: ./gradlew :androidApp:lintRelease --stacktrace

      - name: Upload the lint report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: androidApp/build/reports/lint-results-release.html
          if-no-files-found: warn

  # On the oldest Android Klangbild supports and on a recent one.
  smoke:
    name: Smoke test on Android TV ${{ matrix.version }}
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            version: 9
          - api: 34
            version: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: klangbild-apk

      - name: Free disk space
        # The TV image wants a large userdata partition; the runner's disk is tight.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download the Android TV ${{ matrix.version }} image
        run: bash ci/install-system-image.sh ${{ matrix.api }} android-tv x86

      # The TV as a speaker plays from aiosendspin, the server Music Assistant 2.10.7 runs.
      - name: Sendspin's reference server
        run: |
          python3 -m venv "$RUNNER_TEMP/sendspin"
          "$RUNNER_TEMP/sendspin/bin/pip" install --quiet 'aiosendspin[server]==10.2.0'

      - name: Klangbild with a stand-in Home Assistant on Android TV ${{ matrix.version }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          SENDSPIN_PYTHON: ${{ runner.temp }}/sendspin/bin/python
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          disk-size: 3G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash ci/tv-smoke.sh klangbild.apk

      - name: Upload the smoke test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-smoke-${{ matrix.api }}
          path: smoke/
          if-no-files-found: warn

  rotation:
    name: Key rotation on API ${{ matrix.api }}
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [28, 29, 30, 31, 32, 33, 34, 35, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: klangbild-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download the emulator image
        run: bash ci/install-system-image.sh ${{ matrix.api }} google_apis x86_64

      - name: Install over a copy signed with the old key, refuse the old key afterwards
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash ci/rotation-check.sh klangbild.apk

  measure:
    name: Landscape measurement (${{ matrix.profile }})
    needs: apk
    if: github.event_name == 'workflow_dispatch' && inputs.measure != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [tv_1080p, tv_4k]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: klangbild-apk

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download the Android TV 14 image
        run: bash ci/install-system-image.sh 34 android-tv x86

      - name: Measure
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          MEASURE: ${{ inputs.measure }}
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: ${{ matrix.profile }}
          disable-animations: false
          disk-size: 3G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash ci/landscape-measure-all.sh klangbild.apk "$MEASURE"

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measure-${{ matrix.profile }}
          path: measure/
          if-no-files-found: warn

  release:
    name: GitHub release
    needs: [apk, tests, lint, smoke, rotation]
    # A version tag, or a manual run on main with a version. A beta (a version with a hyphen) comes
    # from a manual run on any branch. A manual run leaves its release a draft only the owner sees,
    # so its notes can be read once more; publishing it on GitHub creates its tag, whose own run
    # builds but publishes nothing.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release != '' && (github.ref == 'refs/heads/main' || contains(inputs.release, '-')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Publishing a draft creates its tag, and the tag's own run comes here with the release out
      # already: it keeps the APK that was published and changes nothing.
      - name: Look for the release published from its draft
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "Klangbild $TAG is out already."
            echo "already=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: steps.published.outputs.already != 'true'
        with:
          name: klangbild-apk

      - name: Sign
        if: steps.published.outputs.already != 'true'
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_LINEAGE: ${{ secrets.RELEASE_LINEAGE }}
          # The key every copy installed so far trusts: the lineage must start with it.
          ORIGINAL_CERT_SHA256: 6a27430a5a3a6507f770002420f7972ba2a99320ed557e32dde734eceaf837d9
        run: |
          if [ -z "$RELEASE_KEYSTORE" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ] || [ -z "$RELEASE_LINEAGE" ]; then
            echo "::error::The signing secrets RELEASE_KEYSTORE, RELEASE_KEYSTORE_PASSWORD and RELEASE_LINEAGE are missing."
            exit 1
          fi
          keys="$(mktemp -d)"
          trap 'rm -rf "$keys"' EXIT
          printf '%s' "$RELEASE_KEYSTORE" | base64 -d > "$keys/release.p12"
          printf '%s' "$RELEASE_LINEAGE" | base64 -d > "$keys/lineage"
          bash ci/sign-release.sh klangbild.apk "$keys/release.p12" "$keys/lineage"

      - name: Publish
        if: steps.published.outputs.already != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          # A manual run creates the tag on the commit it built.
          target_commitish: ${{ github.sha }}
          name: Klangbild ${{ needs.apk.outputs.version_name }}
          body_path: docs/releases/${{ env.TAG }}.md
          # Only a tag with a hyphen is a pre-release; every other one is the latest release. A
          # manual run's release stays a draft until it is published by hand.
          prerelease: ${{ contains(env.TAG, '-') }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          make_latest: ${{ !contains(env.TAG, '-') }}
          files: klangbild.apk
          fail_on_unmatched_files: true
